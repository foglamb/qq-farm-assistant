name: build-and-push-image

# 一体化镜像：农场核心 + Web + AndroidPad 协议。
# 构建在 GitHub 上完成，服务器只做 docker pull，不需要外网构建依赖。
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=four-channels,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') }}
            type=ref,event=branch
            type=sha,format=short

      - name: Ensure the pinned QQ runtime exists in GHCR
        run: |
          set -euo pipefail
          if docker manifest inspect ghcr.io/foglamb/qq-farm-assistant-runtime:4.18.42 >/dev/null 2>&1; then
            echo "runtime image already published"; exit 0
          fi
          if [[ "${{ secrets.GITHUB_TOKEN }}" == "" ]]; then
            echo "cannot publish runtime without a token"; exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 900 \
            https://github.com/XingYunStar/NapCatQQ/releases/download/v4.18.42/napcat-docker-v4.18.42-amd64.tar \
            -o /tmp/napcat-runtime.tar
          echo '85e3fd02b58fd836a0177734b6ff77a896000bcfcf209b3b200d7e8b8452df7c  /tmp/napcat-runtime.tar' | sha256sum -c -
          IMAGE_ID="$(docker load -i /tmp/napcat-runtime.tar | awk '/Loaded image:/ {print $3; exit}')"
          test -n "$IMAGE_ID"
          docker tag "$IMAGE_ID" ghcr.io/foglamb/qq-farm-assistant-runtime:4.18.42
          docker push ghcr.io/foglamb/qq-farm-assistant-runtime:4.18.42

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
