services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-core/Dockerfile}
      args:
        # Optional mirrors; keep the matching checksum when changing a URL.
        - QQ_LOGIN_DEB_URL=${QQ_LOGIN_DEB_URL:-}
        - QQ_LOGIN_DEB_SHA256=${QQ_LOGIN_DEB_SHA256:-}
        - QQ_LOGIN_NAPCAT_URL=${QQ_LOGIN_NAPCAT_URL:-}
        - QQ_LOGIN_NAPCAT_SHA256=${QQ_LOGIN_NAPCAT_SHA256:-02e5ff0f79916c1e04c81c1b4590056406fb4293f1f1300c955e71fd08b2829d}
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped
    ports:
      # 宿主机默认 3900（Windows 端口排除区间会拒绝 3007 监听）；容器内 Node 仍监听 3007
      - "${PORT:-3900}:3007"
    volumes:
      - qq-farm-v3-data:/app/core/data
      - qq-farm-v3-logs:/app/core/data/logs
      # 应用宝 Go 服务的 SQLite 数据库持久化（跨容器重启保留已登录账号）
      - qq-farm-v3-yyb-db:/usr/local/share/yyb-go/resource/db
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3007
      - QQ_LOGIN_ENABLED=${QQ_LOGIN_ENABLED:-1}
      - QQ_LOGIN_MAX_SESSIONS=${QQ_LOGIN_MAX_SESSIONS:-3}
      # 0=按需取码：成功后关闭QQ/NapCat进程，保留登录资料供下次恢复
      - QQ_LOGIN_RESIDENT=${QQ_LOGIN_RESIDENT:-1}
      - QQ_LOGIN_PROTOCOL=${QQ_LOGIN_PROTOCOL:-napcat}
      - PAD_SIGN_URL=${PAD_SIGN_URL:-}
      - PAD_SIGN_STYLE=${PAD_SIGN_STYLE:-}
      - PAD_LOCAL_XWID_URL=${PAD_LOCAL_XWID_URL:-}
      - PAD_PT_VERSION=${PAD_PT_VERSION:-}
      - PAD_QUA=${PAD_QUA:-}
      - PAD_CURRENT_VERSION=${PAD_CURRENT_VERSION:-}
      - PAD_SUB_APP_ID=${PAD_SUB_APP_ID:-}
      - PAD_APP_CLIENT_VERSION=${PAD_APP_CLIENT_VERSION:-}
      - PAD_SDK_BUILD_TIME=${PAD_SDK_BUILD_TIME:-}
      - PAD_SDK_VERSION=${PAD_SDK_VERSION:-}
      - PAD_MISC_BITMAP=${PAD_MISC_BITMAP:-}
      - PAD_SUB_SIG_MAP=${PAD_SUB_SIG_MAP:-}
      - PAD_MAIN_SIG_MAP=${PAD_MAIN_SIG_MAP:-}
      - QQ_LOGIN_SOCKS_PROXY=${QQ_LOGIN_SOCKS_PROXY:-}
      # ===== 应用宝 Go 服务（默认关闭；可在设置中开启，重启后保留选择）=====
      - YYB_ENABLED=${YYB_ENABLED:-0}
      # Node 代理会把 /api/yyb/* 转发到下面的地址；无需在 Web 端再填外部地址
      - YYB_API_URL=http://127.0.0.1:8450
      # 该 token 同时作为：① Go 服务自身的 Bearer 鉴权（YYB_API_TOKEN）② Node 代理转发时携带的 apiKey（YYB_API_KEY）
      - YYB_API_TOKEN=${YYB_API_TOKEN:-}
      - YYB_API_KEY=${YYB_API_TOKEN:-}
      - YYB_PORT=8450
      # 可选：应用宝 Web 管理页登录账密（留空则由服务使用内置默认）
      - YYB_ADMIN_USER=${YYB_ADMIN_USER:-}
      - YYB_ADMIN_PASS=${YYB_ADMIN_PASS:-}
    healthcheck:
      # 同时检查主面板与应用宝服务，任一异常均标记 unhealthy。
      test: ["CMD", "node", "/app/core/docker/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-v3-data:
    name: qq-farm-v3-data
  qq-farm-v3-logs:
    name: qq-farm-v3-logs
  qq-farm-v3-yyb-db:
    name: qq-farm-v3-yyb-db
